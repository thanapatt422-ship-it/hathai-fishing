<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รีวิวลูกค้า | หทัยฟิชชิ่ง</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8f6;
      color: #17352a;
    }
    header {
      background: #0b4d35;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header a { color: white; }
    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 16px;
    }
    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000010;
    }
    label { display: block; margin-top: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #f28c38;
      color: white;
      cursor: pointer;
    }
    .stars button {
      padding: 4px;
      background: transparent;
      color: #ccc;
      font-size: 30px;
    }
    .stars button.active { color: #f2a900; }
    .review {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>⭐ รีวิวจากลูกค้า</h1>
    <p>แบ่งปันประสบการณ์กับหทัยฟิชชิ่ง</p>
    <a href="index.html">← กลับหน้าหลัก</a>
  </header>

  <main>
    <section class="panel">
      <h2>เขียนรีวิวของคุณ</h2>

      <label for="reviewType">รีวิวเกี่ยวกับ</label>
      <select id="reviewType">
        <option value="ร้านค้าและการบริการ">ร้านค้าและการบริการ</option>
        <option value="สินค้า">สินค้า</option>
      </select>

      <label for="reviewName">ชื่อผู้รีวิว</label>
      <input id="reviewName" placeholder="กรอกชื่อของคุณ">

      <label>ให้คะแนน</label>
      <div class="stars" id="reviewStars">
        <button type="button" data-rating="1">★</button>
        <button type="button" data-rating="2">★</button>
        <button type="button" data-rating="3">★</button>
        <button type="button" data-rating="4">★</button>
        <button type="button" data-rating="5">★</button>
      </div>

      <label for="reviewText">ความคิดเห็น</label>
      <textarea id="reviewText" rows="4" placeholder="เขียนความคิดเห็นของคุณ"></textarea>

      <button type="button" id="submitReview">ส่งรีวิว</button>
      <p id="reviewMessage" role="status"></p>
    </section>

    <section class="panel">
      <h2>ความคิดเห็นจากลูกค้า</h2>
      <div id="reviewList">ยังไม่มีรีวิว</div>
    </section>
  </main>

  <script>
    let rating = 0;
    const stars = document.querySelectorAll("#reviewStars button");
    const list = document.getElementById("reviewList");
    const storageKey = "hathaiFishingReviews";

    let reviews = [];
    try {
      reviews = JSON.parse(localStorage.getItem(storageKey) || "[]");
      if (!Array.isArray(reviews)) reviews = [];
    } catch (error) {
      reviews = [];
    }

    function showReviews() {
      list.replaceChildren();

      if (reviews.length === 0) {
        list.textContent = "ยังไม่มีรีวิว";
        return;
      }

      reviews.forEach(item => {
        const card = document.createElement("div");
        card.className = "review";

        const name = document.createElement("strong");
        name.textContent = item.name + " — " + item.type;

        const score = document.createElement("p");
        score.textContent = "★".repeat(item.rating) + "☆".repeat(5 - item.rating);

        const comment = document.createElement("p");
        comment.textContent = item.comment;

        card.append(name, score, comment);
        list.append(card);
      });
    }

    stars.forEach(button => {
      button.addEventListener("click", () => {
        rating = Number(button.dataset.rating);
        stars.forEach(star => {
          star.classList.toggle(
            "active",
            Number(star.dataset.rating) <= rating
          );
        });
      });
    });

    document.getElementById("submitReview").addEventListener("click", () => {
      const name = document.getElementById("reviewName").value.trim();
      const type = document.getElementById("reviewType").value;
      const comment = document.getElementById("reviewText").value.trim();
      const status = document.getElementById("reviewMessage");

      if (!name || !comment || rating === 0) {
        status.textContent = "กรุณากรอกชื่อ ความคิดเห็น และเลือกคะแนนดาว";
        return;
      }

      reviews.unshift({ name, type, comment, rating });

      try {
        localStorage.setItem(storageKey, JSON.stringify(reviews));
      } catch (error) {
        status.textContent = "บันทึกรีวิวไม่ได้ในเบราว์เซอร์นี้";
        reviews.shift();
        return;
      }

      showReviews();
      status.textContent = "เพิ่มรีวิวเรียบร้อยแล้ว";
      document.getElementById("reviewName").value = "";
      document.getElementById("reviewText").value = "";
      rating = 0;
      stars.forEach(star => star.classList.remove("active"));
    });

    showReviews();
  </script>
</body>
</html>
